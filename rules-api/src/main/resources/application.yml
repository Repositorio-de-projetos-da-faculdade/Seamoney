server:
  port: ${PORT:8080}

spring:
  application:
    name: seamoney-rules-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seamoney}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true

seamoney:
  chain-service-url: ${CHAIN_SERVICE_URL:http://localhost:8000}
  chain-service-token: ${CHAIN_SERVICE_TOKEN:}
  usd-brl: ${DEMO_USD_BRL:5.40}
  seed-demo: ${SEED_DEMO:false}
  fee-bps: 100
  bank-fee-pct: 3.0
  max-amount-cents: 100000000
  approval-threshold-cents: ${APPROVAL_THRESHOLD_CENTS:1000000}
  jwt-secret: ${JWT_SECRET:}

---
spring:
  config:
    activate:
      on-profile: demo

seamoney:
  # the demo profile seeds by default; SEED_DEMO=false starts it with an empty database
  seed-demo: ${SEED_DEMO:true}
