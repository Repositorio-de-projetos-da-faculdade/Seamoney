name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rules-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -ntp verify

  chain-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chain-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  images:
    needs: [web, rules-api, chain-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./chain-service
      - run: docker build ./rules-api
      - run: docker build ./web
