name: seamoney

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seamoney
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d seamoney"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chain-service:
    build: ./chain-service
    environment:
      TEMPO_PARTNER_PRIVATE_KEY: ${TEMPO_PARTNER_PRIVATE_KEY:?Set TEMPO_PARTNER_PRIVATE_KEY in .env (testnet key only)}
      TEMPO_GAS_LIMIT: ${TEMPO_GAS_LIMIT:-500000}
      CHAIN_SERVICE_TOKEN: ${CHAIN_SERVICE_TOKEN:-dev-internal-token}
    restart: unless-stopped

  rules-api:
    build: ./rules-api
    environment:
      CHAIN_SERVICE_URL: http://chain-service:8000
      CHAIN_SERVICE_TOKEN: ${CHAIN_SERVICE_TOKEN:-dev-internal-token}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: seamoney
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DEMO_USD_BRL: ${DEMO_USD_BRL:-5.40}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_that_should_be_long_enough_for_hs256_alg}
    depends_on:
      postgres:
        condition: service_healthy
      chain-service:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    environment:
      RULES_API_URL: http://rules-api:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      rules-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
