name: seamoney

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seamoney
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d seamoney"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chain-service:
    build: ./chain-service
    environment:
      TEMPO_PARTNER_PRIVATE_KEY: ${TEMPO_PARTNER_PRIVATE_KEY:?Set TEMPO_PARTNER_PRIVATE_KEY in .env (testnet key only)}
      TEMPO_GAS_LIMIT: ${TEMPO_GAS_LIMIT:-500000}
      CHAIN_SERVICE_TOKEN: ${CHAIN_SERVICE_TOKEN:-dev-internal-token}
      # optional: without them the Solana devnet payer is derived from the Tempo testnet key
      SOLANA_PAYER_PRIVATE_KEY: ${SOLANA_PAYER_PRIVATE_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      # an unconfirmed payment is not sent again before this many seconds (see .env.example)
      PAYMENT_PENDING_GRACE_SECONDS: ${PAYMENT_PENDING_GRACE_SECONDS:-600}
    volumes:
      # the idempotency keys of sent payments; kept across restarts so a retry never pays twice
      - chain-data:/app/data
    restart: unless-stopped

  rules-api:
    build: ./rules-api
    environment:
      CHAIN_SERVICE_URL: http://chain-service:8000
      CHAIN_SERVICE_TOKEN: ${CHAIN_SERVICE_TOKEN:-dev-internal-token}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: seamoney
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DEMO_USD_BRL: ${DEMO_USD_BRL:-5.40}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SEED_DEMO: ${SEED_DEMO:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (a random string of 32+ characters)}
      PROOF_SECRET: ${PROOF_SECRET:-}
      RECOVERY_ENABLED: ${RECOVERY_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      chain-service:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    environment:
      RULES_API_URL: http://rules-api:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # optional password gate for a public demo; the secret signs its cookie (16+ characters)
      DEMO_ACCESS_PASSWORD: ${DEMO_ACCESS_PASSWORD:-}
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      rules-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  chain-data:
